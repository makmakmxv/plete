<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PLETE</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3aa675" />
  <link rel="icon" type="image/png" href="images/icon-192.png" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <img class="banner" src="images/cityhall.jpg" alt="Tuguegarao City Hall" />
    <header>
      <h1>PLETE</h1>
      <p class="tagline"><strong>P</strong>amasahe <strong>L</strong>aging <strong>E</strong>ksakto <strong>T</strong>a <strong>E</strong>very-trip</p>
      <p class="sub">Tuguegarao Tricycle Fare Guide</p>
    </header>

    <main class="content">
      <section class="panel inputs">
        <label for="from">From</label>
        <select id="from"></select>

        <button id="swap" type="button">⇅ Swap Origin &amp; Destination</button>

        <label for="to">To</label>
        <select id="to"></select>

        <label class="toggle">
          <input type="checkbox" id="discount" />
          <span>Student / Senior / PWD</span>
        </label>
      </section>

      <section class="panel result">
        <div class="fare-box">
          <div id="fare-label">Official Regular Fare</div>
          <div id="fare-amount">-</div>
          <div id="fare-note"></div>
        </div>

        <div class="reminder">
          <strong>Reminder:</strong> Pay only the official fare set by the LGU of Tuguegarao City.
        </div>
      </section>
    </main>

          <footer class="hotline">
      <h2 class="hotline-title">Report Overcharging</h2>
      <p id="hotline-name" class="hotline-name">LGU Tuguegarao City</p>
      <p id="hotline-note" class="hotline-note"></p>
      <a id="hotline-btn" class="call-btn" href="#" hidden>Call</a>
      <p id="updated" class="updated"></p>

      <nav class="footer-links">
        <a href="about.html">About</a>
        <a href="about.html#privacy">Privacy</a>
        <a href="about.html#terms">Terms</a>
        <a href="about.html#licenses">Licenses</a>
      </nav>

      <p class="credit">© 2026 PLETE All Rights Reserved</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
